version: '3.8'

services:
  dropship-scout:
    build: .
    container_name: dropship-scout-pro
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - dropship-network

networks:
  dropship-network:
    driver: bridge
